name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version tag to build (for example, v0.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned build dependencies
        shell: pwsh
        run: python -m pip install ".[build]"

      - name: Resolve build metadata
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
              $tag = $env:INPUT_TAG
          } else {
              $tag = $env:REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = "manual-${{ github.run_number }}"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$' -and $env:EVENT_NAME -eq "push") {
              throw "Tag '$tag' is not a semantic version (expected vX.Y.Z)."
          }

          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify package version for release builds
        if: github.event_name == 'push'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $actual = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($actual.Trim() -ne $env:EXPECTED_VERSION) {
              throw "pyproject.toml declares $actual but the release tag requires $env:EXPECTED_VERSION."
          }

      - name: Build Pattern Atlas.exe
        shell: pwsh
        run: .\build.ps1

      - name: Prepare release asset and checksum
        id: asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist\Pattern Atlas.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Build output not found: $source"
          }

          $assetName = "Pattern-Atlas-$env:RELEASE_TAG-Windows-x64.exe"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "dist\$assetName"
          Copy-Item -LiteralPath $source -Destination $assetPath -Force
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
          "asset=$assetPath" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Asset: $assetName"
          Write-Host "SHA-256: $hash"

      - name: Generate release notes from commits
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $allTags = @(git tag --list 'v*.*.*' --sort=-version:refname)
          $previousTag = $allTags | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
              $range = $tag
          } else {
              $range = "$previousTag..$tag"
          }

          $categories = [ordered]@{
              Added = [System.Collections.Generic.List[string]]::new()
              Changed = [System.Collections.Generic.List[string]]::new()
              Fixed = [System.Collections.Generic.List[string]]::new()
              Improved = [System.Collections.Generic.List[string]]::new()
          }

          $commitLines = @(git log --no-merges --format='%H%x09%s' $range)
          foreach ($line in $commitLines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split "`t", 2
              $subject = if ($parts.Count -gt 1) { $parts[1].Trim() } else { $parts[0].Trim() }
              if ($subject -match '^(?:chore|ci|docs|test|style|build)(?:\([^)]*\))?:') { continue }

              $category = 'Changed'
              if ($subject -match '^(feat)(?:\([^)]*\))?!?:\s*(.+)$') {
                  $category = 'Added'
                  $subject = $Matches[2].Trim()
              } elseif ($subject -match '^(fix)(?:\([^)]*\))?!?:\s*(.+)$') {
                  $category = 'Fixed'
                  $subject = $Matches[2].Trim()
              } elseif ($subject -match '^(perf)(?:\([^)]*\))?!?:\s*(.+)$') {
                  $category = 'Improved'
                  $subject = $Matches[2].Trim()
              } elseif ($subject -match '^(?:refactor|ui)(?:\([^)]*\))?!?:\s*(.+)$') {
                  $subject = $Matches[1].Trim()
              } elseif ($subject -match '^[a-z]+(?:\([^)]*\))?!?:\s*(.+)$') {
                  $subject = $Matches[1].Trim()
              }

              if (-not [string]::IsNullOrWhiteSpace($subject)) {
                  $categories[$category].Add("- $subject")
              }
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add('## Changelog')
          $notes.Add('')
          foreach ($category in $categories.Keys) {
              if ($categories[$category].Count -eq 0) { continue }
              $notes.Add("### $category")
              $notes.Add('')
              $categories[$category] | ForEach-Object { $notes.Add($_) }
              $notes.Add('')
          }
          if ($notes.Count -eq 2) {
              $notes.Add('No user-facing changes were recorded.')
              $notes.Add('')
          }
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
              $notes.Add("Full Changelog: https://github.com/${{ github.repository }}/compare/$previousTag...$tag")
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value ($notes -join [Environment]::NewLine) -Encoding utf8
          "body_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pattern-Atlas-${{ steps.metadata.outputs.tag }}-Windows-x64
          path: ${{ steps.asset.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Pattern Atlas ${{ steps.metadata.outputs.tag }}
          files: ${{ steps.asset.outputs.asset }}
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true
