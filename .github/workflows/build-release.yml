name: Build Windows release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version tag to build (for example, 0.3.2)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned build dependencies
        shell: pwsh
        run: python -m pip install ".[build]"

      - name: Resolve build metadata
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
              $tag = $env:INPUT_TAG
          } else {
              $tag = $env:REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = "manual-${{ github.run_number }}"
          }

          $requiresSemVer = $env:EVENT_NAME -eq "push" -or -not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)
          if ($tag -notmatch '^\d+\.\d+\.\d+$' -and $requiresSemVer) {
              throw "Tag '$tag' is not a semantic version (expected X.Y.Z without a v prefix)."
          }

          $version = $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify package version for release builds
        if: github.event_name == 'push' || inputs.tag != ''
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $actual = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($actual.Trim() -ne $env:EXPECTED_VERSION) {
              throw "pyproject.toml declares $actual but the release tag requires $env:EXPECTED_VERSION."
          }

      - name: Build Pattern Atlas.exe
        shell: pwsh
        run: .\build.ps1

      - name: Prepare release asset and checksum
        id: asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist\Pattern Atlas.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Build output not found: $source"
          }

          $assetName = "Pattern-Atlas-$env:RELEASE_TAG-Windows-x64.exe"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "dist\$assetName"
          Copy-Item -LiteralPath $source -Destination $assetPath -Force
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
          "asset=$assetPath" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Asset: $assetName"
          Write-Host "SHA-256: $hash"

      - name: Prepare changelog notes
        id: notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          if (-not (Test-Path -LiteralPath $changelogPath -PathType Leaf)) {
              throw "CHANGELOG.md was not found. Add release notes before publishing."
          }

          $lines = @(Get-Content -LiteralPath $changelogPath)
          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match "^## \[$([regex]::Escape($version))\]") {
                  $start = $index
                  break
              }
          }
          if ($start -lt 0) {
              throw "CHANGELOG.md has no section for [$version]."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match '^## \[') {
                  $end = $index
                  break
              }
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value ($lines[$start..($end - 1)] -join [Environment]::NewLine) -Encoding utf8
          "body_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pattern-Atlas-${{ steps.metadata.outputs.tag }}-Windows-x64
          path: ${{ steps.asset.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Pattern Atlas ${{ steps.metadata.outputs.tag }}
          files: ${{ steps.asset.outputs.asset }}
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true
