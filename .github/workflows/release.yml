name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update the Release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build and publish Windows release
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and build dependencies
        shell: pwsh
        run: python -m pip install ".[build,dev]"

      - name: Verify release version metadata
        shell: pwsh
        run: |
          $packageVersion = python -c "import importlib.metadata; print(importlib.metadata.version('pattern-atlas'))"
          $moduleVersion = python -c "import fl_midi_batch_exporter; print(fl_midi_batch_exporter.__version__)"
          foreach ($actual in @($packageVersion.Trim(), $moduleVersion.Trim())) {
              if ($actual -ne $env:RELEASE_VERSION) {
                  throw "Release tag $env:RELEASE_TAG requires version $env:RELEASE_VERSION, but found $actual."
              }
          }

      - name: Run lint checks
        shell: pwsh
        run: python -m ruff check .

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build Pattern Atlas.exe
        shell: pwsh
        run: .\build.ps1

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist\Pattern Atlas.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Build output not found: $source"
          }

          $assetName = "Pattern-Atlas-$env:RELEASE_VERSION-Windows-x64.exe"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "dist\$assetName"
          Copy-Item -LiteralPath $source -Destination $assetPath -Force

          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$assetPath.sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash *$assetName" -Encoding ascii

          "asset=$assetPath" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT
          "checksum_name=$assetName.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pattern-Atlas-${{ needs.release.outputs.version }}-Windows-x64
          path: |
            ${{ steps.assets.outputs.asset }}
            ${{ steps.assets.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload assets to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $draft = gh release view "$env:RELEASE_TAG" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0) {
              throw "Could not read draft release $env:RELEASE_TAG."
          }
          if ($draft.Trim() -ne 'true') {
              throw "Release $env:RELEASE_TAG is not a draft; refusing to replace published assets."
          }

          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload "$env:RELEASE_TAG" `
                  "${{ steps.assets.outputs.asset }}" `
                  "${{ steps.assets.outputs.checksum }}" `
                  --clobber
              if ($LASTEXITCODE -eq 0) {
                  $uploaded = $true
                  break
              }
              if ($attempt -lt 3) {
                  Write-Warning "Asset upload failed. Retrying attempt $($attempt + 1)/3."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }
          if (-not $uploaded) {
              throw "Failed to upload assets to draft release $env:RELEASE_TAG."
          }

      - name: Publish the verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ steps.assets.outputs.asset_name }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum_name }}
        run: |
          $assetNames = @(gh release view "$env:RELEASE_TAG" --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify assets for draft release $env:RELEASE_TAG."
          }

          foreach ($expected in @($env:ASSET_NAME, $env:CHECKSUM_NAME)) {
              if ($assetNames -notcontains $expected) {
                  throw "Draft release $env:RELEASE_TAG is missing required asset $expected."
              }
          }

          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG; it should remain available as a draft."
          }
