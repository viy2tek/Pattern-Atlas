[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-atlas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mido>=1.3.3", "PySide6>=6.8"]

[project.optional-dependencies]
build = ["nuitka>=4.2"]

[project.scripts]
midi-exporter = "fl_midi_batch_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
